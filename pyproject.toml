[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudshield"
version = "0.1.0"
description = "Real-time CNP fraud detection MVP"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["fraudshield_core*", "fraud_api*", "ml_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Pylance / Pyright: resolve top-level packages from repo root (same layout as editable install)
[tool.pyright]
pythonVersion = "3.11"
extraPaths = ["."]
typeCheckingMode = "basic"
