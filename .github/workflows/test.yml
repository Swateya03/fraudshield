name: Tests

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]

jobs:

  # ── Job 0: Dependency vulnerability scan ──────────────────────────────────
  pip-audit:
    name: pip-audit (CVE scan)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install pip-audit
        run: pip install pip-audit==2.7.3

      - name: Audit dependencies
        run: pip-audit -r requirements.txt --strict

  # ── Job 1: Unit tests — matrix across Python 3.11 and 3.12 ───────────────
  unit-tests:
    needs: pip-audit
    name: "Unit tests (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false    # run both versions even if one fails
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: "Set up Python ${{ matrix.python-version }}"
        uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Run unit tests with coverage
        run: |
          pytest tests/ -v --tb=short \
            --cov=fraud_api \
            --cov=fraudshield_core \
            --cov-report=term-missing \
            --cov-fail-under=60
        env:
          DB_URL: "sqlite:///local_store/test.db"
          REDIS_URL: "redis://localhost:6379"
          API_TOKEN: "test_token_123"
          MODEL_REGISTRY_PATH: "local_store/model_registry"
          CURRENT_MODEL_VERSION: "v1.0.0"

  # ── Job 1b: Alembic schema-drift check ────────────────────────────────────
  alembic-check:
    name: Alembic schema-drift check
    runs-on: ubuntu-latest
    needs: pip-audit

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Check migrations are in sync with db.py
        run: alembic check
        env:
          DB_URL: "sqlite:///local_store/alembic_check.db"

  # ── Job 2: Integration test — real SQLite, mocked Redis ───────────────────
  integration-tests:
    name: Integration tests (API endpoints)
    runs-on: ubuntu-latest
    needs: unit-tests          # only runs if unit tests pass

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Seed test database
        run: python scripts/seed_data.py
        env:
          DB_URL: "sqlite:///local_store/test_integration.db"
          REDIS_URL: "redis://localhost:6379"

      - name: Run API integration tests
        run: pytest tests/test_api.py -v --tb=short
        env:
          DB_URL: "sqlite:///local_store/test_integration.db"
          REDIS_URL: "redis://localhost:6379"
          API_TOKEN: "test_token_123"
          MODEL_REGISTRY_PATH: "local_store/model_registry"
          FRAUD_THRESHOLD: "0.50"
          REVIEW_THRESHOLD: "0.20"

  # ── Job 3: Redis integration — velocity counters, offline features, idempotency ──
  redis-integration:
    name: Redis integration tests
    runs-on: ubuntu-latest
    needs: unit-tests

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Run Redis integration tests
        run: pytest tests/test_redis_features.py -v --tb=short
        env:
          REDIS_URL: "redis://localhost:6379"
          DB_URL: "sqlite:///local_store/test_redis.db"
          API_TOKEN: "test_token_123"
          MODEL_REGISTRY_PATH: "local_store/model_registry"

  # ── Job 4: OpenAPI contract tests — schemathesis property-based ──────────
  contract-tests:
    name: OpenAPI contract tests (schemathesis)
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Run contract tests
        run: pytest tests/test_contract.py -v --tb=short
        env:
          DB_URL: "sqlite:///local_store/test_contract.db"
          REDIS_URL: "redis://localhost:6379"
          API_TOKEN: "test_token_123"
          MODEL_REGISTRY_PATH: "local_store/model_registry"
          FRAUD_THRESHOLD: "0.50"
          REVIEW_THRESHOLD: "0.20"

  # ── Job 5: Data quality gate — simulator produces valid data ──────────────
  data-quality:
    name: Simulator data quality check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Run simulator quality gate
        run: |
          python -c "
          from collections import defaultdict
          from ml_pipeline.data.simulator import (
              generate_users, generate_devices,
              generate_transactions, generate_labels, validate
          )
          users = generate_users(50, seed=42)
          devs  = generate_devices(users, seed=43)
          txns  = generate_transactions(users, devs, n_days=30, seed=44)
          amounts = defaultdict(list)
          for t in txns:
              amounts[t['user_id']].append(t['amount'])
          user_avg = {uid: sum(a)/len(a) for uid, a in amounts.items()}
          labels = generate_labels(txns, user_avg, seed=45)
          result = validate(txns, labels)
          print(f'Amount ratio:    {result[\"amount_ratio\"]}x')
          print(f'IP signal:       {result[\"fraud_ip_rate_pct\"]}%')
          print(f'Device signal:   {result[\"fraud_dev_rate_pct\"]}%')
          print(f'All pass:        {result[\"ALL_PASS\"]}')
          assert result['ALL_PASS'], f'Data quality gate FAILED: {result}'
          print('Data quality gate PASSED')
          "