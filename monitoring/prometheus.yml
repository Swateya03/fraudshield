global:
  scrape_interval:     15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: []   # add your Alertmanager URL here, e.g. ["alertmanager:9093"]

scrape_configs:
  - job_name: "fraudshield-api"
    static_configs:
      # host.docker.internal resolves to the host machine from inside Docker on Windows/Mac.
      # If running on Linux, replace with the host's actual IP (e.g. 172.17.0.1).
      - targets: ["host.docker.internal:8000"]
    metrics_path: /metrics
